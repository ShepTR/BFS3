<!DOCTYPE html>
<html>
<head>
    <title>BattleTech Force - Play View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .play-force-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .play-force-header {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #dee2e6;
        }
        .play-force-units {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: flex-start;
        }
        .play-force-unit {
            width: 40%;
            min-width: 300px;
            margin-bottom: 30px;
            padding: 15px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            background-color: #f8f9fa;
        }
        .unit-label-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .unit-identifier {
            font-size: 1.2em;
            font-weight: bold;
            color: #495057;
            text-align: left;
        }
        .unit-identifier-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #495057;
            text-align: right;
        }
        .card-container {
            position: relative;
            margin-bottom: 15px;
        }
        .play-force-unit img {
            width: 100%;
            height: auto;
        }
        .destroyed-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(20deg);
            color: red;
            font-size: 4em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            display: none;
        }
        .health-counter {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        .health-counter button {
            width: 40px;
            height: 40px;
            font-size: 1.5em;
            border-radius: 50%;
            border: none;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        .health-counter button:hover {
            background-color: #0056b3;
        }
        .health-counter button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        .health-value {
            font-size: 1.5em;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
        }
        .destroy-check {
            height: 40px;
            margin-top: 10px;
            padding: 10px;
            background-color: #dc3545;
            color: white;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        @media (max-width: 768px) {
            .play-force-unit {
                width: 100%;
            }
            .health-counter button {
                width: 50px;
                height: 50px;
                font-size: 1.8em;
            }
            .health-value {
                font-size: 1.8em;
                min-width: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="play-force-container">
        <div class="play-force-header">
            <h3>Play Force</h3>
        </div>
        <div id="playForceUnits" class="play-force-units"></div>
    </div>
    <script>
        // Debug information
        console.log('Play force page loaded');
        console.log('URL parameters:', window.location.search);
    </script>
    <script src="js/playForceDisplay.js"></script>
</body>
</html>
